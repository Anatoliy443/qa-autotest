plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_14
    targetCompatibility = JavaVersion.VERSION_14
}

test {
    useJUnitPlatform()
}

// Задача 1. Эта Gradle-задача запускает все JUnit-тесты проекта.
tasks.register('runAllTests', Test) {
    description = 'Запускает все тесты проекта'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()

    // Показываем в консоли строки, напечатанные через System.out.println.
    testLogging {
        showStandardStreams = true
    }

    // После завершения тестов автоматически запускается вторая задача.
    finalizedBy 'testRunIsOver'
}

// Задача 2. Выполняется после runAllTests и печатает итоговую строку.
tasks.register('testRunIsOver') {
    description = 'Печатает сообщение после завершения всех тестов'
    group = 'verification'

    doLast {
        println 'Test run is over'
    }
}
