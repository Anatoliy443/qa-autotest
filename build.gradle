plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'io.rest-assured:rest-assured:5.5.0'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation 'com.codeborne:selenide:7.18.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Домашняя работа №6: только UI-тесты, новый браузер для каждого теста.
tasks.register('uiTest', Test) {
    description = 'Запускает Selenium и Selenide тесты домашней работы №6'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'ui' }
    maxParallelForks = 1
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    ['ui.baseUrl', 'ui.username', 'ui.password', 'ui.headless'].each { key ->
        if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
    }
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

test {
    // Фильтрация по тегу: запускаются тесты домашней работы №3.
    // Намеренно падающий учебный тест исключён из обычного успешного запуска.
    useJUnitPlatform {
        includeTags 'homework3'
        excludeTags 'expected-failure'
    }
}

// Отдельная задача демонстрирует информативное сообщение падающего ассерта.
// Эта задача ожидаемо завершается с ошибкой, потому что actual намеренно неверный.
tasks.register('runExpectedFailure', Test) {
    description = 'Запускает намеренно падающий тест с информативным assert'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'expected-failure'
    }

    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

// Задача 1. Эта Gradle-задача запускает все JUnit-тесты проекта.
tasks.register('runAllTests', Test) {
    description = 'Запускает все тесты проекта'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // Та же фильтрация по тегу добавлена в пользовательскую задачу запуска.
    useJUnitPlatform {
        includeTags 'homework3'
        excludeTags 'expected-failure'
    }

    // Показываем в консоли строки, напечатанные через System.out.println.
    testLogging {
        showStandardStreams = true
    }

    // После завершения тестов автоматически запускается вторая задача.
    finalizedBy 'testRunIsOver'
}

// Задача 2. Выполняется после runAllTests и печатает итоговую строку.
tasks.register('testRunIsOver') {
    description = 'Печатает сообщение после завершения всех тестов'
    group = 'verification'

    doLast {
        println 'Test run is over'
    }
}

// Только REST API-тесты домашней работы №4. Сервер запускается отдельно.
tasks.register('apiTest', Test) {
    description = 'Запускает все API-тесты домашней работы №4'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'api' }
    maxParallelForks = 1
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    ['api.baseUrl', 'api.username', 'api.password'].each { key ->
        if (System.getProperty(key) != null) {
            systemProperty key, System.getProperty(key)
        }
    }
    // API — внешний изменяемый сервис: каждый вызов должен выполнять запросы.
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
